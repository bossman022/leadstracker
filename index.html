<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kadar Lead Tracker</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--ink:#14181f;--muted:#6a7280;--line:#e3e6ec;--accent:#1f6feb;--accent-ink:#fff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --good:#16a34a;--warn:#d97706;--bad:#dc2626;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1116;--panel:#171b23;--ink:#eceff4;--muted:#99a1b0;--line:#272d38;--accent:#4c8dff;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}
}
:root[data-theme="dark"]{--bg:#0e1116;--panel:#171b23;--ink:#eceff4;--muted:#99a1b0;--line:#272d38;--accent:#4c8dff;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:12px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
main{max-width:1500px;margin:0 auto;padding:18px 20px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12px}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--good)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1;min-width:200px}
.bar select{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--sc,#999);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16px;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.addr{color:var(--muted);font-size:13px}
.addr a{color:inherit}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.02em}
.t-Close{background:#dcfce7;color:#166534}.t-Near{background:#dbeafe;color:#1e40af}.t-Parked{background:#fef3c7;color:#92400e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-Close{background:#14532d;color:#bbf7d0}:root:not([data-theme="light"]) .t-Near{background:#1e3a8a;color:#bfdbfe}:root:not([data-theme="light"]) .t-Parked{background:#78350f;color:#fde68a}}
:root[data-theme="dark"] .t-Close{background:#14532d;color:#bbf7d0}:root[data-theme="dark"] .t-Near{background:#1e3a8a;color:#bfdbfe}:root[data-theme="dark"] .t-Parked{background:#78350f;color:#fde68a}
.basis{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.basis.ok{color:var(--good);border-color:var(--good)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{background:var(--bg);border-radius:8px;padding:7px 9px}
.m small{display:block;color:var(--muted);font-size:11px}
.m b{font-size:14px}
.fee-good{color:var(--good)}.fee-warn{color:var(--warn)}.fee-bad{color:var(--bad)}
.sel-status{font-weight:700;border-color:var(--sc);width:auto;max-width:100%}
.meta{color:var(--muted);font-size:12px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{min-width:270px;max-width:270px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.col h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.col h4 i{width:10px;height:10px;border-radius:50%;background:var(--sc);display:inline-block;margin-right:6px}
.mini{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:8px;padding:8px 9px;margin-bottom:8px;cursor:pointer}
.mini b{display:block;font-size:13px}.mini span{color:var(--muted);font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;justify-content:flex-end;z-index:50}
.overlay.on{display:flex}
.drawer{width:min(620px,100%);height:100%;background:var(--panel);overflow:auto;padding:20px;box-shadow:-10px 0 30px rgba(0,0,0,.25)}
.drawer h2{margin:0 0 2px;font-size:20px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.f label{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:3px}
.f .full{grid-column:1/-1}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.sec h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.checks input{width:auto}
.log{max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.log div{background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px}
.log small{color:var(--muted);display:block}
.note{background:var(--bg);border-left:3px solid var(--warn);padding:8px 10px;border-radius:6px;font-size:13px}
.calc{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px}
.calc div{display:flex;justify-content:space-between;padding:2px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:12px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
@media (max-width:640px){main{padding:12px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.f{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Kadar Holdings: Lead Tracker</h1>
    <div class="sub">Close, Near and Parked leads. Changes save in this browser.</div>
  </div>
  <div class="sp"></div>
  <label class="meta">You are
    <select id="me" style="width:auto;display:inline-block"></select>
  </label>
  <label class="meta">Fee target
    <input id="feeTarget" type="number" step="1000" style="width:100px;display:inline-block">
  </label>
  <label class="meta">Buyer %
    <input id="buyerPct" type="number" min="50" max="85" style="width:64px;display:inline-block">
  </label>
  <button class="btn" id="btnTheme" title="Toggle theme">Theme</button>
  <button class="btn" id="btnTeam">Team names</button>
  <button class="btn" id="btnExport">Export</button>
  <button class="btn" id="btnImport">Import</button>
  <button class="btn" id="btnCsv">CSV</button>
  <input id="file" type="file" accept="application/json" hidden>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input class="grow" id="q" type="search" placeholder="Search name, address, phone, county, notes">
    <select id="fTier"><option value="">All tiers</option><option>Close</option><option>Near</option><option>Parked</option></select>
    <select id="fOwner"></select>
    <select id="sort">
      <option value="tier">Sort: tier, then smallest gap</option>
      <option value="fee">Sort: biggest fee at our offer</option>
      <option value="ask">Sort: lowest ask</option>
      <option value="recent">Sort: recently updated</option>
      <option value="followup">Sort: follow-up date</option>
      <option value="name">Sort: name</option>
    </select>
    <div class="seg"><button id="vCards" class="on">Cards</button><button id="vBoard">Pipeline</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="legend" id="legend"></div>
  <div id="view"></div>
</main>

<div class="overlay" id="ov"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>

/* ---------- STATUSES ---------- */
const STATUSES=[
 ["new","Not called yet","#8b93a1"],
 ["noans","Called, no answer","#f97316"],
 ["vm","Voicemail left","#eab308"],
 ["cb","Callback requested","#3b82f6"],
 ["info","Info gathered","#6366f1"],
 ["offer","Offer made","#a855f7"],
 ["counter","Counter-offer","#ec4899"],
 ["accepted","Offer accepted","#22c55e"],
 ["sent","Contract sent","#14b8a6"],
 ["signed","Contract signed","#15803d"],
 ["assigned","Assigned to buyer","#ca8a04"],
 ["dead","Dead / not interested","#dc2626"],
 ["mls","On MLS / sold","#475569"]
];
const SMAP=Object.fromEntries(STATUSES.map(s=>[s[0],s]));
const NEEDS_CALL=["new","noans","vm"];
const TIER_ORDER={Close:0,Near:1,Parked:2};

/* ---------- STATE ---------- */
const KEY="kadar-lead-tracker-v1";
let S=load();
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.leads)return j}catch(e){}
  return {team:["Hamza","Partner","Acquisitions Mgr"],me:"Hamza",fee:20000,pct:70,theme:"",leads:{}};
}
let saveTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save in this browser")}}
function L(id){ // per-lead state
  if(!S.leads[id])S.leads[id]={status:"new",calls:0,owner:"",follow:"",notes:[],checks:{},arvOk:false,mlsOk:false,upd:0};
  return S.leads[id];
}
function touch(id){L(id).upd=Date.now();save()}
function eff(l){ // effective numbers
  const s=L(l.id);
  const ask=("ask" in s)?s.ask:l.ask;
  const arv=("arv" in s)?s.arv:l.arv;
  const repairs=("repairs" in s)?s.repairs:l.repairs;
  const offer=("offer" in s)?s.offer:l.offer;
  const tier=s.tier||l.tier;
  let bm=("arv" in s||"repairs" in s)?Math.round(arv*S.pct/100-repairs):l.mc+20000;
  const mc=bm-S.fee;
  return {ask,arv,repairs,offer,tier,bm,mc,
    gap:ask==null?null:ask-mc,
    feeOffer:offer==null?null:bm-offer,
    feeAsk:ask==null?null:bm-ask,
    recalced:("arv" in s||"repairs" in s)};
}

/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n==null||isNaN(n)?"n/a":(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");
function feeClass(f){if(f==null)return "";return f>=S.fee?"fee-good":f>=0?"fee-warn":"fee-bad"}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function ago(ts){if(!ts)return "never";const m=Math.round((Date.now()-ts)/60000);if(m<1)return "just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" h ago";return Math.round(h/24)+" d ago"}
function today(){return new Date().toISOString().slice(0,10)}

/* ---------- FILTER STATE (UI only) ---------- */
let view="cards",fStatus="",openId=null;

function filtered(){
  const q=$("#q").value.trim().toLowerCase(),t=$("#fTier").value,o=$("#fOwner").value;
  let a=LEADS.filter(l=>{
    const s=L(l.id),e=eff(l);
    if(t&&e.tier!==t)return false;
    if(o==="__none"){if(s.owner)return false}else if(o&&s.owner!==o)return false;
    if(fStatus==="__call"){if(!NEEDS_CALL.includes(s.status))return false}
    else if(fStatus==="__follow"){if(!s.follow||s.follow>today())return false}
    else if(fStatus&&s.status!==fStatus)return false;
    if(q){const hay=[l.name,l.address,l.phone,l.county,l.email,l.notes,(s.notes||[]).map(n=>n.text).join(" ")].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  const key=$("#sort").value;
  a.sort((x,y)=>{
    const ex=eff(x),ey=eff(y);
    if(key==="fee")return (ey.feeOffer??-1e12)-(ex.feeOffer??-1e12);
    if(key==="ask")return (ex.ask??1e12)-(ey.ask??1e12);
    if(key==="recent")return (L(y.id).upd||0)-(L(x.id).upd||0);
    if(key==="followup")return (L(x.id).follow||"9999")<(L(y.id).follow||"9999")?-1:1;
    if(key==="name")return x.name.localeCompare(y.name);
    const d=TIER_ORDER[ex.tier]-TIER_ORDER[ey.tier];if(d)return d;
    return (ex.gap??1e12)-(ey.gap??1e12);
  });
  return a;
}

  const live=LEADS.filter(l=>["accepted","sent","signed","assigned"].includes(L(l.id).status));
  const pipe=live.reduce((a,l)=>{const e=eff(l);return a+(e.feeOffer??S.fee)},0);
  const items=[
    [total,"Leads in list",""],
    [Math.round(touched/total*100)+"%","Worked so far","<div class='progress'><i style='width:"+(touched/total*100)+"%'></i></div>"],
    [c("new"),"Not called yet",""],
    [c("noans")+c("vm"),"No answer / voicemail",""],
    [c("cb")+c("info"),"Callback or info gathered",""],
    [c("offer")+c("counter"),"Offers out",""],
    [c("accepted")+c("sent")+c("signed"),"Accepted to signed",""],

function setStatus(id,val){
  const s=L(id),old=s.status;if(old===val)return;
  s.status=val;
  addNote(id,`Status: ${SMAP[old][1]} -> ${SMAP[val][1]}`,true);
  if(val==="noans"||val==="vm"){s.calls=(s.calls||0)+1}

  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);if(!j.leads)throw 0;
      let n=0;
      Object.keys(j.leads).forEach(id=>{
        const mine=S.leads[id],theirs=j.leads[id];
        if(!mine||(theirs.upd||0)>(mine.upd||0)){S.leads[id]=theirs;n++}
      });
      (j.team||[]).forEach(t=>{if(!S.team.includes(t))S.team.push(t)});
      save();fillTeam();render();toast("Merged. "+n+" lead(s) updated from the file.");
    }catch(e){toast("That file isn't a tracker export")}
  };
  r.readAsText(f);ev.target.value="";
};
$("#btnCsv").onclick=()=>{
  const cols=["Tier","Name","Phone","Email","Address","County","Type","Status","Assigned","Calls","Follow-up","Ask","ARV","Repairs","MAO","Initial offer","Fee at offer","Gap","ARV basis","ARV verified","Notes"];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=LEADS.map(l=>{const s=L(l.id),e=eff(l);return [e.tier,l.name,l.phone,l.email,l.address,l.county,l.type,SMAP[s.status][1],s.owner,s.calls||0,s.follow,e.ask,e.arv,e.repairs,e.mc,e.offer,e.feeOffer,e.gap,l.basis,s.arvOk?"yes":"no",(s.notes||[]).filter(n=>!n.auto).map(n=>n.by+": "+n.text).join(" | ")].map(q).join(",")});
  const blob=new Blob([cols.map(q).join(",")+"\n"+rows.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kadar-leads-"+today()+".csv";a.click();
};
["#q","#fTier","#fOwner","#sort"].forEach(s=>$(s).addEventListener("input",renderView));
$("#vCards").onclick=()=>{view="cards";$("#vCards").classList.add("on");$("#vBoard").classList.remove("on");renderView()};
$("#vBoard").onclick=()=>{view="board";$("#vBoard").classList.add("on");$("#vCards").classList.remove("on");renderView()};
if(S.theme)document.documentElement.dataset.theme=S.theme;
fillTeam();render();
</script>
