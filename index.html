<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kadar Leads</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;
--close:#16a34a;--near:#d97706;--far:#2563eb;--pass:#9ca3af;--bad:#dc2626;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#181b22;--ink:#f3f4f6;--muted:#9ca3af;--line:#2a2f3a;--accent:#60a5fa;--close:#22c55e;--near:#f59e0b;--far:#60a5fa;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:18px;margin:0;flex:0 0 auto}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.call{background:var(--close);border-color:var(--close);color:#fff}
.pills{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;white-space:nowrap;cursor:pointer}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill b{opacity:.6;margin-left:4px;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:color-mix(in srgb,var(--tc) 7%,var(--panel));border-radius:14px;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--tc) 35%,var(--line));border-left:7px solid var(--tc);padding:12px 14px;cursor:pointer}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--muted);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;border-top:4px solid var(--kc)}
.kpi.on{outline:2px solid var(--kc)}
.kpi b{display:block;font-size:22px;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.card.done{opacity:.55}
.addr{font-weight:700;font-size:16px}
.who{color:var(--muted);font-size:13px;margin-top:1px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.nums div{background:var(--bg);border-radius:10px;padding:7px 8px;text-align:center}
.nums small{display:block;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.nums span{font-weight:800;font-size:14px}
.nums small{font-size:10px}
.flag{display:inline-block;background:#fef3c7;color:#92400e;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;margin-bottom:8px}
@media (prefers-color-scheme:dark){.flag{background:#422006;color:#fcd34d}}
.acts{display:flex;gap:8px;align-items:center}
.acts select{flex:1;font-weight:700;border:2px solid var(--sc);background:color-mix(in srgb,var(--sc) 16%,var(--panel))}
.acts .btn{padding:8px 14px}
.empty{text-align:center;color:var(--muted);padding:50px 0}
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30}
#drawer.on{display:block}
#sheet{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--panel);overflow:auto;padding:16px 16px 40px}
#sheet h2{margin:0 0 2px;font-size:20px}
.sec{margin-top:16px}
.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f2 label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.res{display:flex;justify-content:space-between;background:var(--bg);border-radius:10px;padding:9px 12px;margin-top:8px;font-weight:700}
.good{color:var(--close)}.warn{color:var(--near)}.bad{color:var(--bad)}
.note{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.note small{color:var(--muted)}
a{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
#menu{position:absolute;right:14px;top:52px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;padding:6px;z-index:20}
#menu.on{display:block}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600}
#menu button:hover{background:var(--bg)}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Kadar Leads</h1>
    <input id="q" type="search" placeholder="Search name, address, phone" style="max-width:340px">
    <div class="sp"></div>
    <select id="me" style="width:auto" title="Who is calling"></select>
    <button class="btn" id="mbtn">⋯</button>
  </div>
  <div class="pills" id="pills"></div>
</header>
<div id="menu">
  <button id="bExp">Save backup (JSON)</button>
  <button id="bCsv">Download spreadsheet (CSV)</button>
  <button id="bImp">Load backup</button>
</div>
<input type="file" id="file" accept=".json" hidden>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="row" style="margin-bottom:12px;gap:8px">
    <select id="fs" style="width:auto">
      <option value="">All leads</option>
      <option value="call">Still to call</option>
      <option value="follow">Follow up today</option>
      <option value="hot">Offer stage</option>
    </select>
    <span id="count" style="color:var(--muted);font-size:13px"></span>
  </div>
  <div class="grid" id="list"></div>
</main>
<div id="drawer"><div id="sheet"></div></div>
<div id="toast"></div>

["b9-01",9,"Close","Belinda White (name from email)","409-926-3120","belindawhite10@yahoo.com","2095 Angelina St, Beaumont TX 77701","Jefferson Co.","SFH 1,413sf 2012, 5,000sf lot",65000,135000,31000,43500,35000,"Zestimate $136.4K, comps $132K","CONFIRM WHO CAN SELL: records list Hurley White as owner. Several people live there. Beaumont has strong cash buyers. Walk-away $40K.","new"],
["b9-02",9,"Close","Carolyn Day","818-620-2429","cday918@yahoo.com","65 Rocky Mountain Dr, Walsenburg CO 81089","Huerfano Co. CO","Zillow says SFH 1,778sf built 2018, 0.76ac",85000,300000,39000,154000,38000,"Zestimate $303.8K (unreliable)","VERIFY THERE IS A HOUSE: street is mostly vacant lots and $85K ask is far below the $304K Zestimate. Could be a lot or a bad record. Walsenburg is very rural, buyers are thin. Walk-away $44K.","new"],
["b9-03",9,"Farther","Chuck Riel","315-656-9171","CRIEL1@twcny.rr.com","304 Roxford Rd N, Syracuse NY 13208","Onondaga Co. NY","SFH 3/1 1,204sf 1955",120000,170000,33000,66000,52000,"Zestimate $186K, comps $162.5K","Several people live there, so check owner vs tenants. $54K over our max. Walk-away $60K.","new"],
["b9-04",9,"Farther","Anita Lambert","601-508-9452","anita.lambert44@yahoo.com","150 Kennedy St, State Line MS 39362","Greene Co. MS","SFH 1,694sf 1974, 6.5ac",null,140000,37000,41000,30000,"Zestimate $141.2K","CHECK THE DEED FIRST: her parents home, small mortgage left, may have heirs. No ask given (says updated items). Rural county, buyers are thin. Walk-away $35K.","new"]
];
</script>
<script>
const LEADS=RAW.map(r=>({id:r[0],batch:r[1],tier:r[2],name:r[3],phone:r[4],email:r[5],address:r[6],county:r[7],type:r[8],ask:r[9],arv:r[10],repairs:r[11],mc:r[12],offer:r[13],basis:r[14],notes:r[15],st:r[16]||"new"}));
const STATUSES=[["new","Not called"],["noans","No answer"],["vm","Voicemail"],["cb","Callback"],["info","Got info"],["offer","Offer made"],["counter","Counter"],["accepted","Accepted"],["sent","Contract sent"],["signed","Signed"],["assigned","Assigned"],["dead","Dead"],["mls","On MLS"]];
const SCOL={new:"#9ca3af",noans:"#ef4444",vm:"#f97316",cb:"#3b82f6",info:"#6366f1",offer:"#a855f7",counter:"#ec4899",accepted:"#22c55e",sent:"#14b8a6",signed:"#15803d",assigned:"#ca8a04",dead:"#b91c1c",mls:"#64748b"};
const SN=Object.fromEntries(STATUSES);
const CALL_STAGE=["new","noans","vm"],HOT=["offer","counter","accepted","sent","signed","assigned"],DONE=["dead","mls","assigned"];
const TIER_ORDER={Close:0,Near:1,Farther:2,Pass:3};
const TCOL={Close:"var(--close)",Near:"var(--near)",Farther:"var(--far)",Pass:"var(--pass)"};
const KEY="kadar-lead-tracker-v1";
let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.leads){j.team=j.team||["Hamza","Partner","Acquisitions Mgr"];j.me=j.me||j.team[0];j.fee=j.fee||20000;j.pct=j.pct||70;return j}}catch(e){}
  return {team:["Hamza","Partner","Acquisitions Mgr"],me:"Hamza",fee:20000,pct:70,theme:"",leads:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save in this browser")}}
function L(id){if(!S.leads[id])S.leads[id]={status:(LEADS.find(x=>x.id===id)||{}).st||"new",calls:0,owner:"",follow:"",notes:[],checks:{},arvOk:false,mlsOk:false,upd:0};return S.leads[id]}
function eff(l){const s=L(l.id);const g=k=>(k in s)?s[k]:l[k];
  const ask=g("ask"),arv=g("arv"),repairs=g("repairs"),offer=g("offer");
  const tier=(s.tier==="Parked"?"Farther":s.tier)||l.tier;
  const bm=("arv" in s||"repairs" in s)?Math.round(arv*S.pct/100-repairs):l.mc+20000;
  const mc=bm-S.fee;
  return {ask,arv,repairs,offer,tier,bm,mc,gap:ask==null?null:ask-mc,feeOffer:offer==null?null:bm-offer}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n==null||isNaN(n)?"—":(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");
const short=n=>n==null||isNaN(n)?"—":(n<0?"-":"")+"$"+(Math.abs(n)>=1000?(Math.round(Math.abs(n)/100)/10)+"K":Math.abs(n));
const today=()=>new Date().toISOString().slice(0,10);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1700)}
function tel(p){return "tel:+1"+String(p).replace(/\D/g,"")}
function flagOf(n){const m=(n||"").match(/^(ONLY WORKS[^.]*\.|CONFIRM[^.]*\.|VERIFY[^.]*\.)/);return m?m[1].replace(/\.$/,"").replace(/^[A-Z \$0-9']{4,}/,x=>x.toLowerCase().replace(/^./,c=>c.toUpperCase()).replace(/\$(\d+)k/gi,"$$$1K")):""}

let fTier="active",fStat="",fq="",fG="";
const GROUPS={call:["new"],called:["noans","vm","cb","info","offer","counter","accepted","sent","signed","assigned","dead","mls"],noans:["noans","vm"],offers:["offer","counter","accepted","sent","signed","assigned"],signed:["signed","assigned"],dead:["dead","mls"]};
function visible(l){const s=L(l.id),e=eff(l);
  if(e.tier==="Pass")return false;if(fTier!=="active"&&e.tier!==fTier)return false;
  if(fG&&!GROUPS[fG].includes(s.status))return false;
  if(fStat==="call"&&!CALL_STAGE.includes(s.status))return false;
  if(fStat==="follow"&&!(s.follow&&s.follow<=today()))return false;
  if(fStat==="hot"&&!HOT.includes(s.status))return false;
  if(fq){const h=(l.name+" "+l.address+" "+l.phone+" "+l.county).toLowerCase();if(!h.includes(fq.toLowerCase())&&!l.phone.replace(/\D/g,"").includes(fq.replace(/\D/g,"")||"~"))return false}
  return true}
function render(){
  const all=LEADS.map(l=>[l,eff(l)]);
  const c=t=>all.filter(x=>x[1].tier===t).length;
  const defs=[["active","All",all.length-c("Pass")],["Close","Close",c("Close")],["Near","Near",c("Near")],["Farther","Farther",c("Farther")]];
  $("#pills").innerHTML=defs.map(d=>`<button class="pill ${fTier===d[0]?"on":""}" data-t="${d[0]}">${d[1]}<b>${d[2]}</b></button>`).join("");
  $("#pills").querySelectorAll(".pill").forEach(b=>b.onclick=()=>{fTier=b.dataset.t;render()});
  const rows=all.filter(x=>visible(x[0])).sort((a,b)=>{
    const da=DONE.includes(L(a[0].id).status)?1:0,db=DONE.includes(L(b[0].id).status)?1:0;
    return da-db||TIER_ORDER[a[1].tier]-TIER_ORDER[b[1].tier]||(a[1].gap??1e9)-(b[1].gap??1e9)});
  const act=all.filter(x=>x[1].tier!=="Pass").map(x=>x[0]);const cnt=k=>act.filter(l=>GROUPS[k].includes(L(l.id).status)).length;
  const fees=act.filter(l=>GROUPS.signed.includes(L(l.id).status)).reduce((a,l)=>a+(eff(l).feeOffer||0),0);
  const K=[["call","To call","#9ca3af"],["called","Called","#3b82f6"],["noans","No answer","#ef4444"],["offers","Offers out","#a855f7"],["signed","Contracts signed","#15803d"],["dead","Dead","#b91c1c"]];
  $("#kpis").innerHTML=K.map(k=>`<div class="kpi ${fG===k[0]?"on":""}" data-g="${k[0]}" style="--kc:${k[2]}"><b>${cnt(k[0])}</b><span>${k[1]}</span></div>`).join("")+`<div class="kpi" style="--kc:#ca8a04;cursor:default"><b>${money(fees)}</b><span>Fees locked in</span></div>`;
  $("#kpis").querySelectorAll("[data-g]").forEach(el=>el.onclick=()=>{fG=fG===el.dataset.g?"":el.dataset.g;render()});
  $("#count").textContent=rows.length+" leads";
  $("#list").innerHTML=rows.length?rows.map(([l,e])=>card(l,e)).join(""):`<div class="empty">Nothing here</div>`;
  $("#list").querySelectorAll(".card").forEach(el=>el.onclick=ev=>{if(ev.target.closest("a,select,button"))return;openLead(el.dataset.id)});
  $("#list").querySelectorAll("select[data-id]").forEach(sel=>sel.onchange=()=>setStatus(sel.dataset.id,sel.value));
}
function card(l,e){const s=L(l.id),fl=flagOf(l.notes);
  return `<div class="card ${["dead","mls"].includes(s.status)?"done":""}" data-id="${l.id}" style="--tc:${SCOL[s.status]};--sc:${SCOL[s.status]}">
  ${fl?`<div class="flag">⚠ ${esc(fl)}</div>`:""}
  <div class="top"><div class="addr">${esc(l.address)}</div><span class="chip">${e.tier}</span></div>
  <div class="who">${esc(l.name)} · ${esc(l.county)}</div>
  <div class="nums"><div><small>ARV</small><span>${short(e.arv)}</span></div><div><small>Ask</small><span>${short(e.ask)}</span></div><div><small>Offer</small><span>${short(e.offer)}</span></div><div><small>Max</small><span>${short(e.mc)}</span></div><div><small>Fee</small><span class="${e.feeOffer==null?"":e.feeOffer>=S.fee?"good":e.feeOffer>=0?"warn":"bad"}">${short(e.feeOffer)}</span></div></div>
  <div class="acts"><a class="btn call" href="${tel(l.phone)}">Call</a><select data-id="${l.id}">${STATUSES.map(x=>`<option value="${x[0]}" ${s.status===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div></div>`}
function setStatus(id,val){const s=L(id);if(s.status===val)return;
  s.notes.push({by:S.me,text:"Status: "+SN[s.status]+" → "+SN[val],ts:Date.now(),auto:true});s.status=val;s.upd=Date.now();save();render();toast("Saved")}

function openLead(id){const l=LEADS.find(x=>x.id===id),s=L(id),e=eff(l);
  const inp=(k,lab,v)=>`<div><label>${lab}</label><input type="number" inputmode="numeric" data-k="${k}" value="${v??""}"></div>`;
  $("#sheet").innerHTML=`
  <div class="row"><div><h2>${esc(l.address)}</h2><div class="who">${esc(l.name)} · ${esc(l.county)} · ${esc(l.type)}</div></div><div class="sp"></div><button class="btn" id="x">Close</button></div>
  <div class="row sec"><a class="btn call" style="flex:1;text-align:center;text-decoration:none" href="${tel(l.phone)}">Call ${esc(l.phone)}</a>
    <a class="btn" style="text-decoration:none" href="sms:+1${l.phone.replace(/\D/g,"")}">Text</a></div>
  <div class="sec" style="font-size:14px">${l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a> · `:""}<a target="_blank" rel="noopener" href="https://www.zillow.com/homes/${encodeURIComponent(l.address.replace(/[,]/g,"").replace(/\s+/g,"-"))}_rb/">Zillow</a></div>
  ${flagOf(l.notes)?`<div class="sec"><div class="flag">⚠ ${esc(flagOf(l.notes))}</div></div>`:""}
  <div class="sec"><h3>Numbers</h3><div class="f2">${inp("ask","Ask",e.ask)}${inp("offer","Our offer",e.offer)}${inp("arv","ARV (fixed-up value)",e.arv)}${inp("repairs","Repairs",e.repairs)}</div>
    <div class="res"><span>Max we can pay</span><span id="rMax" class="${e.mc>=0?"good":"bad"}">${money(e.mc)}</span></div>
    <div class="res"><span>Our fee at this offer</span><span id="rFee">${money(e.feeOffer)}</span></div>
    <div class="res"><span>Over max by</span><span id="rGap">${e.gap==null?"—":money(e.gap)}</span></div>
    <div class="who" style="margin-top:6px">${esc(l.basis)}</div></div>
  <div class="sec"><h3>Status</h3><div class="f2"><select id="st" style="border:2px solid ${SCOL[s.status]};background:color-mix(in srgb,${SCOL[s.status]} 16%,var(--panel));font-weight:700">${STATUSES.map(x=>`<option value="${x[0]}" ${s.status===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select>
    <select id="tier">${["Close","Near","Farther"].map(t=>`<option ${e.tier===t?"selected":""}>${t}</option>`).join("")}</select></div>
    <div class="f2" style="margin-top:8px"><div><label>Follow up on</label><input type="date" id="fu" value="${esc(s.follow)}"></div>
    <div><label>Calls made: ${s.calls||0}</label><button class="btn" id="logc" style="width:100%">+ Log a call</button></div></div></div>
  <div class="sec"><h3>Notes</h3>${l.notes?`<div class="note">${esc(l.notes)}</div>`:""}
    ${(s.notes||[]).filter(n=>!n.auto).map(n=>`<div class="note"><small>${esc(n.by)} · ${new Date(n.ts).toLocaleDateString()}</small><br>${esc(n.text)}</div>`).join("")}
    <textarea id="nt" rows="2" placeholder="Add a note" style="margin-top:8px"></textarea><button class="btn pri" id="addn" style="margin-top:6px">Add note</button></div>`;
  $("#drawer").classList.add("on");
  const close=()=>{$("#drawer").classList.remove("on");render()};
  $("#x").onclick=close;
  $("#sheet").querySelectorAll("input[data-k]").forEach(i=>i.oninput=()=>{const k=i.dataset.k;s[k]=i.value===""?null:Number(i.value);s.upd=Date.now();save();
    const f=eff(l);$("#rMax").textContent=money(f.mc);$("#rMax").className=f.mc>=0?"good":"bad";$("#rFee").textContent=money(f.feeOffer);$("#rGap").textContent=f.gap==null?"—":money(f.gap)});
  $("#st").onchange=ev=>{setStatus(id,ev.target.value)};
  $("#tier").onchange=ev=>{s.tier=ev.target.value;save();toast("Saved")};
  $("#fu").onchange=ev=>{s.follow=ev.target.value;save()};
  $("#logc").onclick=()=>{s.calls=(s.calls||0)+1;s.upd=Date.now();if(s.status==="new")s.status="noans";save();openLead(id)};
  $("#addn").onclick=()=>{const t=$("#nt").value.trim();if(!t)return;s.notes.push({by:S.me,text:t,ts:Date.now()});s.upd=Date.now();save();openLead(id)};
}
$("#drawer").onclick=ev=>{if(ev.target.id==="drawer"){$("#drawer").classList.remove("on");render()}};
$("#q").oninput=ev=>{fq=ev.target.value.trim();render()};
$("#fs").onchange=ev=>{fStat=ev.target.value;render()};
function fillMe(){$("#me").innerHTML=S.team.map(t=>`<option ${t===S.me?"selected":""}>${esc(t)}</option>`).join("")}
$("#me").onchange=ev=>{S.me=ev.target.value;save()};
$("#mbtn").onclick=ev=>{ev.stopPropagation();$("#menu").classList.toggle("on")};
document.addEventListener("click",()=>$("#menu").classList.remove("on"));
function dl(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}
$("#bExp").onclick=()=>dl("kadar-leads-"+today()+".json",new Blob([JSON.stringify(S)],{type:"application/json"}));
$("#bImp").onclick=()=>$("#file").click();
$("#file").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.leads)throw 0;S=j;save();fillMe();render();toast("Backup loaded")}catch(e){toast("Not a valid backup")}};r.readAsText(f)};
$("#bCsv").onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=LEADS.map(l=>{const s=L(l.id),e=eff(l);return [e.tier,l.name,l.phone,l.email,l.address,l.county,SN[s.status],s.calls||0,s.follow,e.ask,e.arv,e.repairs,e.mc,e.offer,l.notes].map(q).join(",")});
  dl("kadar-leads-"+today()+".csv",new Blob([["Tier,Name,Phone,Email,Address,County,Status,Calls,Follow-up,Ask,ARV,Repairs,Max,Offer,Notes"].concat(rows).join("\n")],{type:"text/csv"}))};
fillMe();render();
</script>
</body>
